name: Publish

on:
  push:
    branches: [main]

jobs:
  version-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    outputs:
      version_bumped: ${{ steps.check.outputs.bumped }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@govuk-one-login"
      - name: Check if version was bumped
        id: check
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view @govuk-one-login/dpt-logging version 2>/dev/null || echo "0.0.0")
          if [ "$LOCAL_VERSION" != "$PUBLISHED_VERSION" ]; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "Version already bumped: $LOCAL_VERSION (published: $PUBLISHED_VERSION)"
          else
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "Version not bumped. Auto-bumping patch version..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            npm version patch --no-git-tag-version
            NEW_VERSION=$(node -p "require('./package.json').version")
            git add package.json package-lock.json
            git commit -m "chore: auto-bump version to $NEW_VERSION [skip ci]"
            git push
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    runs-on: ubuntu-latest
    needs: version-check
    if: needs.version-check.outputs.version_bumped == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@govuk-one-login"
      - run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build
      - run: npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  delete-branch:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Delete feature branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_REF: ${{ github.event.ref }}
        run: |
          BRANCH="${BRANCH_REF#refs/heads/}"
          if [[ "$BRANCH" != "main" ]]; then
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$BRANCH"
          fi
